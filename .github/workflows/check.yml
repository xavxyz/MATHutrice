name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      # Package boundaries: no private name imported from outside its package.
      - run: uv run tach check
      # No import cycle between packages.
      - run: uv run python scripts/check_cycles.py
      - run: uv run pytest -p no:tach
